# Per-category anomaly score thresholds for verdict
thresholds:
  bottle: 100.0
  cable: 100.0
  capsule: 100.0
  carpet: 100.0
  grid: 100.0
  hazelnut: 100.0
  leather: 100.0
  pill: 100.0
  screw: 0.003
  toothbrush: 100.0
  transistor: 100.0
  wood: 100.0
  zipper: 100.0

hyperparameters:
  backbone: "ViT-G (BLIP-2)"
  n_queries: 32
  n_min: 32
  n_max: 256
  HPA: true
  alpha: 0.25
  beta: 0.65
  gamma: 0.10
  frequency_stream: true
  scoring: "Dual Mahalanobis"
  aggregation: "Top-3 Mean Pooling"
