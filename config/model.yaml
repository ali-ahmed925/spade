# ── BLIP-2 Pretrained Backbone ──
blip2:
  model_name: "Salesforce/blip2-opt-2.7b"

# ── Vision Transformer (frozen ViT-G from BLIP-2) ──
# image_size 448 with patch_size 14 gives a 32x32 = 1024 patch grid. Position
# embeddings are pretrained at 224 and bicubically interpolated (native support
# in Blip2VisionEmbeddings).
#
# WHY 448: at 224 one patch covers 196 px = 0.39% of the image, and measured
# MVTec defects — capsule crack 0.30%, poke 0.23%, faulty_imprint 0.28% — are
# SMALLER THAN ONE PATCH, so they are averaged with normal material before
# scoring. At 448 each patch covers 0.098% and those defects span ~3 patches.
# PaDiM and PatchCore run 56x56 and 28x28 grids for the same reason.
#
# feature_layers: which encoder blocks to tap (0-indexed, 39 blocks in ViT-G).
# The final block is BLIP-2's most semantic representation and is invariant to
# exactly the sub-semantic damage we must detect; mid-level blocks retain local
# appearance. Negative indices count from the end.
vit:
  image_size: 448
  patch_size: 14                          # BLIP-2 ViT-G uses patch_size 14
  num_patches: 1024                       # (448/14)^2
  feature_layers: [20, 30]                # tapped blocks, fused downstream
  fusion_proj_dim: 256                    # per-layer projection width

# ── Q-Former contextualisation ──
# Every patch attends to the 32 query tokens summarising the image, so a patch
# that looks normal but sits in the wrong role (cable_swap: blue insulation
# where brown belongs; cut_lead: bare board where a lead belongs) gets a
# different descriptor from the same appearance in a legitimate position.
# Descriptor width = 2 * hidden_dim (local half + context half).
context:
  hidden_dim: 256                         # -> 512-d contextual descriptor
  n_heads: 8
  dropout: 0.0

# ── LOCAL detection pathway ──
# The contextualizer overwrites rather than augments: the only representation
# Mahalanobis ever saw was [local | context], where the context half is
# attention over 32 IMAGE-LEVEL tokens and is near-constant across patches
# within an image. That half varies between images but not between patches, so
# under one pooled Gaussian it inflates Sigma without adding discrimination --
# and no raw local appearance reached the score without global mixing first.
#
# This pathway branches before the contextualizer and is scored against a
# coreset memory bank, which makes no unimodality assumption at all. The
# Q-Former pathway is untouched and still contributes its own stream.
local_pathway:
  enabled: true
  source: "fused"            # fused = trainable fusion output (512-d)
                             # raw   = concatenated tapped ViT layers (2816-d),
                             #         the untrained PatchCore-style control
  neighborhood: 3            # k x k average pool on the 32x32 grid; 1 disables
                             # it and is the ablation control

# ── Coreset memory bank ──
# PatchCore's normal model: keep the normal patches themselves and score by
# distance to the nearest one. Greedy k-center subsampling retains the outlying
# normal modes that random sampling would drop -- exactly what a rare but
# legitimate normal patch needs to match against.
memory_bank:
  coreset_ratio: 0.01        # fraction of training patches kept
  max_size: 50000            # hard cap on bank size
  k: 1                       # neighbours averaged; 1 is PatchCore's choice
  projection_dim: 128        # JL projection used for SELECTION only
  seed: 0
  query_chunk: 1024          # queries per distance matrix

# ── Patch Scoring ──
# Mahalanobis scores the contextual descriptors. The old additive
# attention-importance and cross terms are gone: the Q-Former now enters through
# the descriptor itself rather than through a term measured at ~1e-5 of the
# score magnitude and anti-correlated with anomaly at image level.
scoring:
  # Stream weights. Each stream is divided by its own global scale first, so
  # these are directly comparable. They are PRIORS, not tuned values: eval.py
  # reports every stream standalone, so local-only vs contextual-only is read
  # off a single run rather than fitted.
  w_local: 1.0                            # local kNN weight (memory bank)
  beta: 0.9                               # contextual Mahalanobis weight
  gamma: 0.1                              # frequency Mahalanobis weight
  mahalanobis_gamma: 1.0                  # non-linear amplification factor
  mahalanobis_reg: 1.0e-4                 # covariance regularization

  # normalize_streams: divide each stream by ONE GLOBAL constant (EMA-estimated
  # during training, fixed at inference) so beta/gamma mean what they say. This
  # is NOT per-image normalization (see EVALUATION_FIX.md).
  normalize_streams: true

  # How per-patch scores become one image score. "max" is what PaDiM, PatchCore
  # and the WACV reference use; "topk_mean" (k scaled with the patch grid) is
  # what this repo has always used and is the non-standard choice. eval.py
  # reports BOTH on every run so the difference is visible and never silently
  # selected for whichever scores higher.
  image_aggregation: "topk_mean"          # topk_mean | max

  # Gaussian sigma applied to the anomaly map before metrics. PaDiM/PatchCore/
  # SingleNet all smooth (~4 at 224px); scaled with resolution here.
  smooth_sigma: 8.0

# ── Frequency Features ──
frequency:
  enabled: true                           # parallel Fourier stream
  feature_dim: 32                         # output feature dimension
  num_bands: 6                            # number of frequency bands
  use_phase: true                         # include phase information

# ── Normal Statistics ──
# 1024 patches per image (4x the old grid), so the buffer is enlarged to keep a
# comparable number of IMAGES represented in each covariance refit.
# ── Normal statistics during training ──
# Exact streaming sufficient statistics (count, sum x, sum x x'), refit every
# step. The previous deque + EMA-of-window-covariances lagged the feature space
# by up to 100 steps, which is what made the loss exploitable by shrinking
# features. Exact accumulators cost D + D^2 floats (1 MB at 512) and ~537 MFLOP
# per batch, so refitting every step is affordable.
normal_stats:
  buffer_size: 20000                      # legacy; unused by the streaming path
  update_frequency: 1                     # steps between refits
  # Pin the scored descriptor's output LayerNorm to (weight=1, bias=0). It then
  # emits ||x - mean|| = sqrt(D) exactly, so NO parameter can globally rescale
  # it and the shrinkage exploit is removed structurally.
  freeze_output_scale: true

# ── LLM Projection ──
projection:
  output_dim: 2560                        # must match LLM embed dim (Phi-2 = 2560)
  trainable: false                        # no loss supervises the text path yet
