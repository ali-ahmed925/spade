# ── BLIP-2 Pretrained Backbone ──
blip2:
  model_name: "Salesforce/blip2-opt-2.7b"

# ── Vision Transformer (derived from BLIP-2's ViT-G) ──
vit:
  image_size: 224
  patch_size: 14                          # BLIP-2 ViT-G uses patch_size 14
  num_patches: 256                        # (224/14)^2

# ── Hierarchical Patch Annealing (HPA) ──
hpa:
  n_max: 256                              # Starting patches
  n_min: 32                               # Minimum patches at final step
  t_steps: 8                              # Total refinement steps (reduced for memory efficiency)
  w: 0.4                                  # Weight for early retention
  p1: 0.5                                 # Concave component (gentle early pruning)
  p2: 2.0                                 # Convex component (mid-late aggressive pruning)

# ── Patch Scoring ──
scoring:
  alpha: 0.4                              # Attention importance weight
  beta: 0.4                               # Mahalanobis deviation weight
  lambda: 0.2                             # Cross-term weight
  mahalanobis_gamma: 1.3                  # Non-linear amplification factor
  mahalanobis_reg: 1e-6                   # Covariance regularization

# ── Normal Statistics ──
normal_stats:
  buffer_size: 10000                      # Buffer size for normal patches
  update_frequency: 100                   # Steps between statistics updates

# ── LLM Projection ──
projection:
  output_dim: 2560                        # must match LLM embed dim (Phi-2 = 2560)
