# ── BLIP-2 Pretrained Backbone ──
blip2:
  model_name: "Salesforce/blip2-opt-2.7b"

# ── Vision Transformer (derived from BLIP-2's ViT-G) ──
vit:
  image_size: 224
  patch_size: 14                          # BLIP-2 ViT-G uses patch_size 14
  num_patches: 256                        # (224/14)^2

# ── Hierarchical Patch Annealing (HPA) ──
hpa:
  enabled: false                            # Enable HPA (set to false to score all patches directly)
  n_max: 256                              # Starting patches
  n_min: 32                               # Minimum patches at final step
  t_steps: 8                              # Total refinement steps (reduced for memory efficiency)
  w: 0.4                                  # Weight for early retention
  p1: 0.5                                 # Concave component (gentle early pruning)
  p2: 2.0                                 # Convex component (mid-late aggressive pruning)

# ── Patch Scoring ──
scoring:
  alpha: 0.7                              # Attention importance weight (MUCH HIGHER - HPA's main contribution)
  beta: 0.1                               # Spatial Mahalanobis deviation weight (MINIMAL - least important)
  gamma: 0.15                             # Frequency Mahalanobis deviation weight (MODERATE - second priority)
  lambda: 0.05                            # Cross-term weight (MINIMAL)
  mahalanobis_gamma: 1.3                  # Non-linear amplification factor
  mahalanobis_reg: 1e-6                   # Covariance regularization

  # ── Scoring correctness (fix/gradient-correctness branch) ──
  # normalize_streams: divide each stream by ONE GLOBAL constant (EMA-estimated
  #   during training, fixed at inference) so alpha/beta/gamma mean what they
  #   say. Without it the configured 0.25/0.65 split is really ~1e-5 / ~1.
  #   This is NOT per-image normalization (see EVALUATION_FIX.md).
  # attention_aggregation: 'logit_mean' (importance responds to the weights) or
  #   'softmax_sum' (legacy; patch-mean is structurally constant, so mean-based
  #   losses cannot train it).
  # Set normalize_streams:false + attention_aggregation:softmax_sum to reproduce
  # pre-fix checkpoints exactly.
  normalize_streams: true
  attention_aggregation: "logit_mean"

  # Gaussian sigma applied to the anomaly map before metrics. PaDiM/PatchCore/
  # SingleNet all smooth (~4 at 224px); this pipeline did not, which costs pixel
  # AUROC and confounds any resolution experiment. Must be identical across both
  # arms of any comparison. 0 reproduces the pre-fix behaviour.
  smooth_sigma: 4.0

# ── Frequency Features (NEW) ──
frequency:
  enabled: true                           # Enable frequency feature extraction
  feature_dim: 32                         # Output feature dimension
  num_bands: 6                            # Number of frequency bands
  use_phase: true                          # Include phase information

# ── Normal Statistics ──
normal_stats:
  buffer_size: 10000                      # Buffer size for normal patches
  update_frequency: 100                   # Steps between statistics updates

# ── LLM Projection ──
projection:
  output_dim: 2560                        # must match LLM embed dim (Phi-2 = 2560)
