# ── BLIP-2 Pretrained Backbone ──
blip2:
  model_name: "Salesforce/blip2-opt-2.7b"

# ── Vision Transformer (derived from BLIP-2's ViT-G) ──
vit:
  image_size: 224
  patch_size: 14                          # BLIP-2 ViT-G uses patch_size 14
  num_patches: 256                        # (224/14)^2

# ── Hierarchical Patch Annealing (HPA) ──
hpa:
  enabled: true                            # Enable HPA (set to false to score all patches directly)
  n_max: 256                              # Starting patches
  n_min: 32                               # Minimum patches at final step
  t_steps: 12                              # Total refinement steps (reduced for memory efficiency)
  w: 0.4                                  # Weight for early retention
  p1: 0.5                                 # Concave component (gentle early pruning)
  p2: 2.0                                 # Convex component (mid-late aggressive pruning)

# ── Patch Scoring ──
scoring:
  use_mahalanobis: true                   # Enable/disable Mahalanobis scoring (set to false to use only attention)
  alpha: 0.25                              # Attention importance weight (MUCH HIGHER - HPA's main contribution)
  beta: 0.65                               # Spatial Mahalanobis deviation weight (MINIMAL - least important)
  gamma: 0.1                             # Frequency Mahalanobis deviation weight (MODERATE - second priority)
  lambda: 0.001                            # Cross-term weight (MINIMAL)
  mahalanobis_gamma: 1.0                  # Non-linear amplification factor (1.0 = no amplification)
  mahalanobis_reg: 1e-4                   # Covariance regularization (increased for stability)
  # GMM density (optional; replaces single-Gaussian Mahalanobis when enabled)
  gmm:
    enabled: true                        # true = sklearn GMM NLL scoring; false = classic Mahalanobis
    spatial_components: 8                 # K for ViT patch features
    freq_components: 5                    # K for frequency features
    covariance_type: full                 # sklearn GaussianMixture covariance_type
    reg_covar: 1.0e-4                     # regularization added to covariances (sklearn reg_covar)
    fit_max_samples: 15000                # max normal patches used to fit GMM (subsampling; 0 or null = use all)
    fit_subsample_seed: 42                # RNG seed for subsample (fit only; inference uses full image)
  verify_attention: false                 # Enable attention verification (logs and visualizes attention on normal vs anomalous patches)
  use_raw_attention: true                 # Use raw attention scores instead of softmax probabilities (larger scale, better match with Mahalanobis)
  # Image-level score from patch scores (AUROC / inference)
  image_score:
    mode: quantile                        # quantile | max | topk_mean
    quantile: 0.99                      # per-image quantile over all patches (mode=quantile)
    top_k: 3                             # mean of top-k patches (mode=topk_mean)

# ── Frequency Features (NEW) ──
frequency:
  enabled: true                           # Enable frequency feature extraction
  feature_dim: 32                         # Output feature dimension
  num_bands: 6                            # Number of frequency bands
  use_phase: true                          # Include phase information

# ── Normal Statistics ──
normal_stats:
  buffer_size: 10000                      # Buffer size for normal patches
  update_frequency: 100                   # Steps between statistics updates

# ── LLM Projection ──
projection:
  output_dim: 2560                        # must match LLM embed dim (Phi-2 = 2560)
