# ── BLIP-2 Pretrained Backbone ──
blip2:
  model_name: "Salesforce/blip2-opt-2.7b"

# ── Vision Transformer (frozen ViT-G from BLIP-2) ──
# image_size 448 with patch_size 14 gives a 32x32 = 1024 patch grid. Position
# embeddings are pretrained at 224 and bicubically interpolated (native support
# in Blip2VisionEmbeddings).
#
# WHY 448: at 224 one patch covers 196 px = 0.39% of the image, and measured
# MVTec defects — capsule crack 0.30%, poke 0.23%, faulty_imprint 0.28% — are
# SMALLER THAN ONE PATCH, so they are averaged with normal material before
# scoring. At 448 each patch covers 0.098% and those defects span ~3 patches.
# PaDiM and PatchCore run 56x56 and 28x28 grids for the same reason.
#
# feature_layers: which encoder blocks to tap (0-indexed, 39 blocks in ViT-G).
# The final block is BLIP-2's most semantic representation and is invariant to
# exactly the sub-semantic damage we must detect; mid-level blocks retain local
# appearance. Negative indices count from the end.
vit:
  image_size: 448
  patch_size: 14                          # BLIP-2 ViT-G uses patch_size 14
  num_patches: 1024                       # (448/14)^2
  feature_layers: [20, 30]                # tapped blocks, fused downstream
  fusion_proj_dim: 256                    # per-layer projection width

# ── Q-Former contextualisation ──
# Every patch attends to the 32 query tokens summarising the image, so a patch
# that looks normal but sits in the wrong role (cable_swap: blue insulation
# where brown belongs; cut_lead: bare board where a lead belongs) gets a
# different descriptor from the same appearance in a legitimate position.
# Descriptor width = 2 * hidden_dim (local half + context half).
context:
  hidden_dim: 256                         # -> 512-d contextual descriptor
  n_heads: 8
  dropout: 0.0

# ── Patch Scoring ──
# Mahalanobis scores the contextual descriptors. The old additive
# attention-importance and cross terms are gone: the Q-Former now enters through
# the descriptor itself rather than through a term measured at ~1e-5 of the
# score magnitude and anti-correlated with anomaly at image level.
scoring:
  beta: 0.9                               # contextual Mahalanobis weight
  gamma: 0.1                              # frequency Mahalanobis weight
  mahalanobis_gamma: 1.0                  # non-linear amplification factor
  mahalanobis_reg: 1.0e-4                 # covariance regularization

  # normalize_streams: divide each stream by ONE GLOBAL constant (EMA-estimated
  # during training, fixed at inference) so beta/gamma mean what they say. This
  # is NOT per-image normalization (see EVALUATION_FIX.md).
  normalize_streams: true

  # Gaussian sigma applied to the anomaly map before metrics. PaDiM/PatchCore/
  # SingleNet all smooth (~4 at 224px); scaled with resolution here.
  smooth_sigma: 8.0

# ── Frequency Features ──
frequency:
  enabled: true                           # parallel Fourier stream
  feature_dim: 32                         # output feature dimension
  num_bands: 6                            # number of frequency bands
  use_phase: true                         # include phase information

# ── Normal Statistics ──
# 1024 patches per image (4x the old grid), so the buffer is enlarged to keep a
# comparable number of IMAGES represented in each covariance refit.
normal_stats:
  buffer_size: 20000                      # descriptors held for refitting
  update_frequency: 100                   # steps between statistics updates

# ── LLM Projection ──
projection:
  output_dim: 2560                        # must match LLM embed dim (Phi-2 = 2560)
  trainable: false                        # no loss supervises the text path yet
