# ── Training ──
training:
  epochs: 20
  batch_size: 2  # 448x448 input = 1025 tokens through ViT-G; self-attention cost
                 # is ~16x the 224 setting, so the batch is reduced accordingly.
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  gradient_clip: 1.0
  seed: 42
  log_interval: 10                        # steps between log prints
  save_interval: 5                        # epochs between checkpoint saves
  # Checkpoints from the feature-space redesign land here, leaving ./checkpoints
  # (the pre-redesign models) untouched. Those cannot be loaded by the current
  # model anyway — the descriptor space changed from 1408-d raw ViT patches to
  # 512-d contextual descriptors, and the patch grid from 256 to 1024 — so they
  # are kept for reference, not reuse.
  checkpoint_dir: "./checkpoints_v2"
  early_stopping:
    enabled: true
    patience: 10                          # epochs to wait before stopping
    mode: "max"                            # "max" for AUROC, "min" for loss
    min_delta: 0.001                      # minimum change to qualify as improvement
  checkpoint:
    # Which metric decides "best". The other is logged but never selected on.
    # image_auroc is the primary research objective.
    #
    # The previous two-metric rule with a degradation tolerance ratcheted: it
    # saved when the secondary improved and the primary degraded within
    # tolerance, then reset the reference to the degraded value, so the bar slid
    # downward while every step reported "new best" (measured: 0.9125 -> 0.8565
    # on capsule image AUROC).
    selection_metric: "image_auroc"       # image_auroc | patch_auroc
    selection_min_delta: 0.0              # required improvement to overwrite
    # Ties on the primary metric are broken by the other one. Without this a
    # saturated primary (wood hits val image AUROC 1.0000 at epoch 1) freezes
    # the checkpoint on the first epoch and discards the rest of training.
    selection_tie_tol: 1.0e-6
    # Which detector ranks the epochs. "full" fits the memory bank and the
    # Mahalanobis statistics before each validation, so selection uses the SAME
    # detector that gets reported. "contextual" is the old behaviour: rank by the
    # Mahalanobis stream alone, which is a different detector from the one that
    # ships and can therefore save the wrong epoch.
    #
    # "full" costs one extra forward pass over train/good per epoch plus the
    # coreset build -- roughly 1.5-2x epoch time. That is the price of the
    # selected checkpoint actually being the best one.
    selection_detector: "full"     # full | contextual

# ── Normal-model fit (runs once, after the last epoch) ──
# Replaces the 20k rolling deque that previously supplied the statistics. Every
# normal patch in train/good is passed once; the Mahalanobis covariance is fitted
# in closed form and the coreset memory bank is built from the same pass.
normal_fit:
  max_patches: 500000          # cap on patches held in RAM (~1 GB at 512-d);
                               # beyond it patches are kept by Bernoulli draw,
                               # never by truncation
  selection_max_patches: 100000  # cheaper fit used for per-epoch selection;
                                 # selection needs epochs RANKED correctly, not
                                 # measured exactly, so it runs on a subsample

# ── Weights & Biases ──
wandb:
  enabled: true
  project: "spade-anomaly-detection"
  entity: null                            # your wandb username/team (or null)
  name: null                               # run name (auto-generated if null)
  tags: []
  notes: null

# ── Loss Weights ──
loss:
  # Common parameters
  patch_weight: 1.0
  
  # Synthetic training parameters (when synthetic.enabled=true)
  use_focal: false
  focal_alpha: 0.25
  focal_gamma: 2.0
  
  # Normal-only training parameters (when synthetic.enabled=false)
  var_weight: 0.1              # Weight for variance term in Mahalanobis loss (encourages tight clustering)
  use_pseudo: true           # Use pseudo-anomaly loss for contrastive learning
  pseudo_epsilon: 0.01       # Perturbation magnitude (applied to EMBEDDINGS)
  pseudo_margin: 0.1         # Perturbed patches must score this much higher

  # ── Auxiliary query grounding ──
  # Makes reserved query tokens attend to anomalous regions, so the tokens the
  # language component consumes actually encode WHERE the defect is. D1 measured
  # that they currently do not: on wood, mean per-query pixel AUROC 0.5093
  # (chance), best query 0.6309.
  #
  # Synthetic CutPaste/Crack anomalies are used ONLY as a source of patch masks.
  # The detection objective and the normal-only Mahalanobis statistics are
  # untouched — the anomaly score never sees a synthetic label, and synthetic
  # patches are excluded from both the statistics and the detection loss.
  #
  # grounding_weight: 0.0 disables the whole path and is the EXACT baseline
  # control — no synthetic images are generated, so training is bit-identical
  # to a pre-grounding run.
  grounding_weight: 0.0        # lambda; try 0.05 / 0.1 / 0.5 in a sweep
  grounding_queries: 4         # leading query tokens reserved for anomalies
  grounding_synthetic_prob: 0.5  # fraction of training images given a synthetic defect
  grounding_pos_weight: "auto"   # anomalous patches are a small minority
  clamp_max: 100.0            # Maximum score for soft clipping



