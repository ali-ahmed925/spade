# ── Training ──
training:
  epochs: 20
  batch_size: 2  # 448x448 input = 1025 tokens through ViT-G; self-attention cost
                 # is ~16x the 224 setting, so the batch is reduced accordingly.
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  gradient_clip: 1.0
  seed: 42
  log_interval: 10                        # steps between log prints
  save_interval: 5                        # epochs between checkpoint saves
  # Checkpoints from the feature-space redesign land here, leaving ./checkpoints
  # (the pre-redesign models) untouched. Those cannot be loaded by the current
  # model anyway — the descriptor space changed from 1408-d raw ViT patches to
  # 512-d contextual descriptors, and the patch grid from 256 to 1024 — so they
  # are kept for reference, not reuse.
  checkpoint_dir: "./checkpoints_v2"
  early_stopping:
    enabled: true
    patience: 10                          # epochs to wait before stopping
    mode: "max"                            # "max" for AUROC, "min" for loss
    min_delta: 0.001                      # minimum change to qualify as improvement
  checkpoint:
    degradation_tolerance: 0.02           # Acceptable degradation (e.g., 0.02 = 2% drop is OK)
                                          # If one metric improves and other degrades <= this, still save

# ── Weights & Biases ──
wandb:
  enabled: true
  project: "spade-anomaly-detection"
  entity: null                            # your wandb username/team (or null)
  name: null                               # run name (auto-generated if null)
  tags: []
  notes: null

# ── Loss Weights ──
loss:
  # Common parameters
  patch_weight: 1.0
  
  # Synthetic training parameters (when synthetic.enabled=true)
  use_focal: false
  focal_alpha: 0.25
  focal_gamma: 2.0
  
  # Normal-only training parameters (when synthetic.enabled=false)
  var_weight: 0.1              # Weight for variance term in Mahalanobis loss (encourages tight clustering)
  use_pseudo: true           # Use pseudo-anomaly loss for contrastive learning
  pseudo_epsilon: 0.01       # Perturbation magnitude (applied to EMBEDDINGS)
  pseudo_margin: 0.1         # Perturbed patches must score this much higher
  clamp_max: 100.0            # Maximum score for soft clipping



