# ── LLM Configuration ──
llm:
  model_name: "microsoft/phi-2"           # frozen LLM for text reasoning
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  device_map: "auto"

# ── Prompt Template ──
prompt:
  system: >
    The following visual tokens describe an industrial object.
    Determine if an anomaly exists and describe its location. DO NOT REPEAT THE SAME INFORMATION.
  prefix: "<visual_tokens>"
  suffix: "</visual_tokens>\nAnalysis:"



