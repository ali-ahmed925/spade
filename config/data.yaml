# ── Dataset ──
dataset:
  name: "mvtec"
  root: "./datasets/mvtec_anomaly_detection"
  category: "leather"
  image_size: 448                         # must match vit.image_size (32x32 patch grid)
  num_workers: 4

# ── Synthetic Anomaly Generation ──
# DISABLED: Training on normal samples only (unsupervised anomaly detection)
synthetic:
  enabled: false                          # Set to false for unsupervised training on normal samples only
  synthetic_prob: 0.0                     # No synthetic anomalies during training
  # Methods are automatically selected based on category (see synthetic.py CATEGORY_METHODS)
  # Available methods: "cutpaste", "crack"
  cutpaste:
    area_ratio: [0.02, 0.15]
    aspect_ratio: [0.3, 3.3]
    blend_alpha: 0.7                       # blending factor (0.0 = full patch, 1.0 = full background)
    color_jitter: 0.1                      # color matching strength
  crack:
    num_cracks: 3                          # number of main crack branches
    min_length: 0.1                        # min length as fraction of image diagonal
    max_length: 0.4                        # max length as fraction of image diagonal
    min_width: 1                           # min crack width in pixels
    max_width: 3                           # max crack width in pixels
    darkness: 0.3                          # how dark the crack appears (0.0-1.0)
    branching_prob: 0.3                    # probability of creating a branch

# ── Validation ──
validation:
  enabled: true
  use_real_test: true                     # Use real test anomalies for validation (split test 50/50)
                                          # If false, uses synthetic anomalies from train_good (not recommended)
  source: "train_good"                    # Ignored if use_real_test=true
  size: 40                                # Ignored if use_real_test=true
  seed: 42
  synthetic_prob: 0.2                     # Ignored if use_real_test=true
  synthetic_method: "cutpaste"            # Ignored if use_real_test=true



